[project]
name = "studies"
version = "0.1.0"
description = "studies"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=1.26.4",
    "scipy>=1.13.0",
    "matplotlib>=3.8.4",
    "pandas>=2.2.2",
    "autograd>=1.6.2",
    "ipykernel>=6.29.4",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["physlab"]

[tool.ruff]
extend-exclude = [
    ".virtual_documents",
    "2025S",
    "2025W",
    "2026W",
]

[tool.ruff.lint]
extend-select = [
    "I", # isort (import sorting)
    "UP", # pyupgrade (modernize syntax)
    "B", # flake8-bugbear (catch common bugs)
    "SIM", # flake8-simplify (simplify code logic)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"*.ipynb" = ["E402"]

<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
    </marker>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="50" y1="250" x2="370" y2="250" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="50" y1="250" x2="50" y2="30" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Labels for axes -->
  <text x="380" y="255" font-family="Arial" font-size="16">T</text>
  <text x="45" y="25" font-family="Arial" font-size="16" text-anchor="end">V</text>

  <!-- Ticks and labels -->
  <!-- T1 -->
  <line x1="85" y1="245" x2="85" y2="255" stroke="black" stroke-width="2"/>
  <text x="85" y="275" font-family="Arial" font-size="16" text-anchor="middle">T₁</text>
  <!-- T2 -->
  <line x1="320" y1="245" x2="320" y2="255" stroke="black" stroke-width="2"/>
  <text x="320" y="275" font-family="Arial" font-size="16" text-anchor="middle">T₂</text>
  <!-- V1 -->
  <line x1="45" y1="70" x2="55" y2="70" stroke="black" stroke-width="2"/>
  <text x="40" y="75" font-family="Arial" font-size="16" text-anchor="end">V₁</text>
  <!-- V2 -->
  <line x1="45" y1="215" x2="55" y2="215" stroke="black" stroke-width="2"/>
  <text x="40" y="220" font-family="Arial" font-size="16" text-anchor="end">V₂</text>

  <!-- Curve b (VT^3 = const) passing exactly through endpoints -->
  <path d="M 85 70 Q 110 180 320 215" fill="none" stroke="black" stroke-width="2"/>
  
  <!-- Arrow on curve b - Positioned more towards the middle -->
  <path d="M 185 174 L 197 181" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Path a (split to place arrows precisely in the middle of each segment) -->
  <path d="M 85 70 L 85 142.5 L 85 215" fill="none" stroke="black" stroke-width="2" marker-mid="url(#arrow)"/>
  <path d="M 85 215 L 202.5 215 L 320 215" fill="none" stroke="black" stroke-width="2" marker-mid="url(#arrow)"/>

  <!-- Points -->
  <circle cx="85" cy="70" r="4" fill="black"/>
  <circle cx="320" cy="215" r="4" fill="black"/>

  <!-- Labels a and b -->
  <text x="70" y="145" font-family="Arial" font-size="16">a</text>
  <text x="195" y="170" font-family="Arial" font-size="16">b</text>

  <!-- Equation label and pointer - Brought even closer -->
  <text x="180" y="105" font-family="Arial" font-size="14">VT³ = CONSTANT</text>
  <path d="M 175 110 Q 155 120 145 150" fill="none" stroke="black" stroke-width="1" marker-end="url(#arrowhead)"/>

</svg>

    <text x="275" y="58" class="sign">+</text>
    <text x="310" y="58" class="sign">+</text>
    <text x="345" y="58" class="sign">+</text>
    <text x="380" y="58" class="sign">+</text>
    <text x="415" y="58" class="sign">+</text>

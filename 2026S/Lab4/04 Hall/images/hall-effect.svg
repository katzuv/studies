    <text x="30" y="180" class="sign">-</text>
    <text x="65" y="180" class="sign">-</text>
    <text x="100" y="180" class="sign">-</text>
    <text x="135" y="180" class="sign">-</text>
    <text x="170" y="180" class="sign">-</text>
    <text x="205" y="180" class="sign">-</text>
    <text x="240" y="180" class="sign">-</text>
    <text x="275" y="180" class="sign">-</text>
    <text x="310" y="180" class="sign">-</text>
    <text x="345" y="180" class="sign">-</text>
    <text x="380" y="180" class="sign">-</text>
    <text x="415" y="180" class="sign">-</text>
    <text x="450" y="180" class="sign">-</text>

    <circle cx="60" cy="115" r="14" fill="none" stroke="#000000" stroke-width="1.2"/>
    <circle cx="60" cy="115" r="2" fill="#000000"/>
    <text x="53" y="148" class="label-italic">B</text>

    <line x1="330" y1="115" x2="420" y2="115" class="vector" />
    <text x="370" y="105" class="label-italic">I</text>

    <circle cx="240" cy="115" r="14" class="circle-charge"/>
    <text x="236" y="120" class="label" font-size="20">-</text>
    
    <line x1="226" y1="115" x2="190" y2="115" class="vector" stroke-width="1.5"/>
    <text x="202" y="105" class="label-italic" font-size="18">v</text>

    <line x1="240" y1="101" x2="240" y2="65" class="vector" />
    <text x="248" y="80" class="label-italic">F<tspan font-size="14" dy="5">E</tspan></text>

    <line x1="240" y1="129" x2="240" y2="165" class="vector" />
    <text x="248" y="155" class="label-italic">F<tspan font-size="14" dy="5">B</tspan></text>

    <text x="210" y="235" class="label-italic" font-size="24">q &lt; 0</text>
  </g>

  <g transform="translate(480, 270)">
    <line x1="0" y1="0" x2="50" y2="0" class="axis" />
    <text x="55" y="5" class="label-italic" font-size="18">x</text>
    
    <line x1="0" y1="0" x2="0" y2="-50" class="axis" />
    <text x="-5" y="-58" class="label-italic" font-size="18">y</text>
    
    <line x1="0" y1="0" x2="-35" y2="35" class="axis" />
    <text x="-50" y="40" class="label-italic" font-size="18">z</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <style>
    .label { font-family: 'Times New Roman', Times, serif; font-size: 20px; fill: #000000; }
    .label-italic { font-family: 'Times New Roman', Times, serif; font-size: 20px; font-style: italic; fill: #000000; }
    .sign { font-family: Courier, monospace; font-size: 18px; fill: #000000; font-weight: bold; }
    .axis { stroke: #000000; stroke-width: 1.2; marker-end: url(#arrow); }
    .vector { stroke: #000000; stroke-width: 1.8; marker-end: url(#arrow); }
    .boundary { stroke: #000000; stroke-width: 2; }
    .circle-charge { fill: #ffffff; stroke: #000000; stroke-width: 1.2; }
  </style>

  <g id="left-diagram">
    <line x1="20" y1="40" x2="460" y2="40" class="boundary" />
    <line x1="20" y1="190" x2="460" y2="190" class="boundary" />

    <text x="30" y="56" class="sign">-</text>
    <text x="65" y="56" class="sign">-</text>
    <text x="100" y="56" class="sign">-</text>
    <text x="135" y="56" class="sign">-</text>
    <text x="170" y="56" class="sign">-</text>
    <text x="205" y="56" class="sign">-</text>
    <text x="240" y="56" class="sign">-</text>
    <text x="275" y="56" class="sign">-</text>
    <text x="310" y="56" class="sign">-</text>
    <text x="345" y="56" class="sign">-</text>
    <text x="380" y="56" class="sign">-</text>
    <text x="415" y="56" class="sign">-</text>
    <text x="450" y="56" class="sign">-</text>

    <text x="30" y="182" class="sign">+</text>
    <text x="65" y="182" class="sign">+</text>
    <text x="100" y="182" class="sign">+</text>
    <text x="135" y="182" class="sign">+</text>
    <text x="170" y="182" class="sign">+</text>
    <text x="205" y="182" class="sign">+</text>
    <text x="240" y="182" class="sign">+</text>
    <text x="275" y="182" class="sign">+</text>
    <text x="310" y="182" class="sign">+</text>
    <text x="345" y="182" class="sign">+</text>
    <text x="380" y="182" class="sign">+</text>
    <text x="415" y="182" class="sign">+</text>
    <text x="450" y="182" class="sign">+</text>

    <circle cx="60" cy="115" r="14" fill="none" stroke="#000000" stroke-width="1.2"/>
    <circle cx="60" cy="115" r="2" fill="#000000"/>
    <text x="53" y="148" class="label-italic">B</text>

    <line x1="330" y1="115" x2="420" y2="115" class="vector" />
    <text x="370" y="105" class="label-italic">I</text>

    <circle cx="240" cy="115" r="14" class="circle-charge"/>
    <text x="234" y="121" class="label" font-size="18">+</text>
    
    <line x1="254" y1="115" x2="290" y2="115" class="vector" stroke-width="1.5"/>
    <text x="268" y="105" class="label-italic" font-size="18">v</text>

    <line x1="240" y1="101" x2="240" y2="65" class="vector" />
    <text x="248" y="80" class="label-italic">F<tspan font-size="14" dy="5">E</tspan></text>

    <line x1="240" y1="129" x2="240" y2="165" class="vector" />
    <text x="248" y="155" class="label-italic">F<tspan font-size="14" dy="5">B</tspan></text>

    <text x="210" y="235" class="label-italic" font-size="24">q &gt; 0</text>
  </g>

  <g id="right-diagram" transform="translate(480, 0)">
